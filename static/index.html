<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人知识库问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f2f3f5; }
  .wrap { max-width: 760px; margin: 30px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); overflow: hidden; }
  header { background: #1f2733; color: #fff; padding: 14px 20px; font-size: 15px; }
  header span { opacity: .7; font-size: 12px; margin-left: 8px; }
  #chat { height: 420px; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #4f7cff; color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: #f1f2f4; color: #222; border-bottom-left-radius: 2px; }
  .src { font-size: 12px; color: #999; margin: 4px 0 0 4px; }
  #form { display: flex; padding: 12px; border-top: 1px solid #eee; }
  #input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
  #input:focus { border-color: #4f7cff; }
  #send { margin-left: 10px; border: none; background: #4f7cff; color: #fff; padding: 0 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="wrap">
  <header>知识库问答助手<span>RAG + 工具调用 · FastAPI</span></header>
  <div id="chat">
    <div class="msg bot"><div class="bubble">你好！可以问我知识库里的问题，例如：\n「二分查找的时间复杂度是多少？」\n也可以问：「知识库里有哪些文档？」</div></div>
  </div>
  <div id="form">
    <input id="input" placeholder="输入问题，回车发送…" autofocus>
    <button id="send">发送</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');

function addMsg(text, who, sources) {
  const m = document.createElement('div');
  m.className = 'msg ' + who;
  m.innerHTML = '<div class="bubble"></div>';
  m.querySelector('.bubble').textContent = text;
  chat.appendChild(m);
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'src';
    s.textContent = '来源：' + sources.join('、');
    chat.appendChild(s);
  }
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  input.value = '';
  send.disabled = true;
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const data = await r.json();
    if (r.ok) addMsg(data.answer, 'bot', data.sources);
    else addMsg('出错了：' + (data.error || r.status), 'bot');
  } catch (e) {
    addMsg('请求失败：' + e.message, 'bot');
  }
  send.disabled = false;
  input.focus();
}

send.onclick = ask;
input.onkeydown = e => { if (e.key === 'Enter') ask(); };
</script>
</body>
</html>
